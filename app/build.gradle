apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
            keyAlias 'lystiq'
            keyPassword 'lystiq'
            storeFile file('C:\\Users\\User\\AndroidStudioProjects\\lystiqv3.2\\lystiqv3.2\\keystore\\lystiq.jks')
            storePassword 'lystiq'
        }
    }
    compileSdkVersion 28
    buildToolsVersion '28.0.1'
    defaultConfig {
        applicationId "com.app.lystiq"
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 11
        versionName '3.8'
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    dexOptions {
        javaMaxHeapSize "2048M"
    }
    sourceSets {
        main.res.srcDirs += 'src/main/res-buynow'
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
    }
}

repositories {
    mavenCentral()
    maven {
        url "http://repo.pageturner-reader.org"
    }
    google()
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
    compile fileTree(include: ['*.jar'], dir: 'libs')
    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.android.support:appcompat-v7:27.0.2'
    implementation 'com.android.support:design:27.0.2'
    implementation 'com.android.support:recyclerview-v7:27.0.2'
    implementation 'com.android.support:cardview-v7:27.0.2'
    implementation 'com.android.volley:volley:1.1.0'
    implementation 'com.facebook.android:facebook-android-sdk:4.39.0'
    implementation 'com.android.support:multidex:1.0.2'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.wang.avi:library:2.1.3'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.google.android.gms:play-services:11.8.0'
    implementation 'com.google.firebase:firebase-messaging:11.8.0'
    implementation 'com.google.firebase:firebase-core:11.8.0'
    implementation 'com.braintreepayments.api:braintree:2.10.0'
    implementation 'com.braintreepayments.api:drop-in:3.2.1'
    implementation project(':parallaxScroll')
    implementation project(':pagerIndicator')
    implementation 'com.itextpdf:itextg:5.5.9'
    implementation 'com.facebook.android:account-kit-sdk:4.+'
    implementation project(':materialsliders')
    implementation project(path: ':multipleimageselect')
    implementation 'com.faendir:acra:4.10.0'
    implementation('io.socket:socket.io-client:1.0.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.flurry.android:analytics:12.1.0'
    implementation 'com.flurry.android:ads:12.1.0'
}
apply plugin: 'com.google.gms.google-services'